name: Analyze XAUUSD levels
on:
  schedule:
    - cron: "30 0 * * 1-5" # 03:30 Kenya time (EAT)
    - cron: "0 9 * * 1-5" # 12:00 Kenya time (EAT)
    - cron: "33 14 * * 1-5" # 17:33 Kenya time (EAT)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xauusd-levels-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Calculate levels
        run: python make_levels.py
      - name: Commit changed data
        run: |
          if ! git diff --quiet -- levels.json data_prev.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add levels.json data_prev.json
            git commit -m "Update XAUUSD levels"
            git push
          fi
